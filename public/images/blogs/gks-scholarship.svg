<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0e00"/>
      <stop offset="100%" stop-color="#2a1800"/>
    </linearGradient>
    <linearGradient id="gold-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.08)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="980" height="540" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="rgba(245,158,11,0.08)"/>
  </pattern>
  <rect width="980" height="540" fill="url(#dots)"/>

  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="980" height="5" fill="url(#gold-bar)"/>

  <!-- Left accent line -->
  <rect x="0" y="5" width="5" height="535" fill="rgba(245,158,11,0.3)"/>

  <!-- Certificate frame — right side -->
  <rect x="520" y="40" width="420" height="460" rx="4" fill="url(#cert-bg)" stroke="rgba(245,158,11,0.2)" stroke-width="1.5"/>
  <!-- Inner border -->
  <rect x="532" y="52" width="396" height="436" rx="2" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>
  <!-- Corner ornaments -->
  <rect x="520" y="40" width="20" height="3" fill="url(#gold-bar)"/>
  <rect x="520" y="40" width="3" height="20" fill="url(#gold-bar)"/>
  <rect x="920" y="40" width="20" height="3" fill="url(#gold-bar)"/>
  <rect x="937" y="40" width="3" height="20" fill="url(#gold-bar)"/>
  <rect x="520" y="497" width="20" height="3" fill="url(#gold-bar)"/>
  <rect x="520" y="480" width="3" height="20" fill="url(#gold-bar)"/>
  <rect x="920" y="497" width="20" height="3" fill="url(#gold-bar)"/>
  <rect x="937" y="480" width="3" height="20" fill="url(#gold-bar)"/>

  <!-- Certificate content -->
  <text x="730" y="108" text-anchor="middle" fill="rgba(245,158,11,0.4)" font-size="11" font-family="Arial" font-weight="700" letter-spacing="3">REPUBLIC OF KOREA</text>
  <text x="730" y="135" text-anchor="middle" fill="rgba(245,158,11,0.6)" font-size="13" font-family="Arial" letter-spacing="2">NATIONAL INSTITUTE FOR INTERNATIONAL EDUCATION</text>

  <!-- GKS emblem -->
  <circle cx="730" cy="220" r="50" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <circle cx="730" cy="220" r="36" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="730" y="215" text-anchor="middle" fill="#f59e0b" font-size="34" font-family="Arial" font-weight="900">GKS</text>
  <text x="730" y="235" text-anchor="middle" fill="rgba(245,158,11,0.6)" font-size="9" font-family="Arial" font-weight="700" letter-spacing="1">NIIED · 2026</text>

  <text x="730" y="295" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="11" font-family="Arial" letter-spacing="1">THIS CERTIFICATE IS AWARDED TO</text>
  <rect x="580" y="308" width="300" height="1" fill="rgba(245,158,11,0.2)"/>
  <text x="730" y="340" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-size="13" font-family="Georgia, serif" font-style="italic">Nepali Students · 2026 Batch</text>
  <rect x="580" y="352" width="300" height="1" fill="rgba(245,158,11,0.2)"/>

  <text x="730" y="385" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="11" font-family="Arial" letter-spacing="1">FOR EXCELLENCE IN ACADEMIC ACHIEVEMENT</text>
  <text x="730" y="415" text-anchor="middle" fill="#f59e0b" font-size="22" font-family="Georgia, serif" font-weight="700">Global Korea Scholarship</text>
  <text x="730" y="438" text-anchor="middle" fill="rgba(245,158,11,0.5)" font-size="12" font-family="Arial">Fully Funded · Tuition · Stipend · Airfare · Language Training</text>

  <!-- Seal -->
  <circle cx="630" cy="480" r="22" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="630" y="487" text-anchor="middle" fill="rgba(245,158,11,0.5)" font-size="16">★</text>

  <!-- Left side — editorial text -->
  <text x="48" y="116" fill="rgba(245,158,11,0.6)" font-size="11" font-family="Arial" font-weight="700" letter-spacing="3">SCHOLARSHIP GUIDE · 2026</text>

  <text x="48" y="200" fill="#ffffff" font-size="58" font-family="Georgia, ui-serif, serif" font-weight="800" letter-spacing="-2">GKS</text>
  <text x="48" y="264" fill="#ffffff" font-size="36" font-family="Georgia, ui-serif, serif" font-weight="700">Scholarship</text>
  <text x="48" y="310" fill="rgba(255,255,255,0.45)" font-size="18" font-family="Arial">Complete Guide for Nepali Students</text>

  <rect x="48" y="336" width="300" height="1.5" fill="rgba(245,158,11,0.3)"/>

  <!-- Benefits list -->
  <text x="48" y="372" fill="rgba(245,158,11,0.8)" font-size="13" font-family="Arial" font-weight="700">WHAT GKS COVERS</text>

  <rect x="48" y="392" width="3" height="16" rx="1.5" fill="#f59e0b"/>
  <text x="62" y="404" fill="rgba(255,255,255,0.75)" font-size="14" font-family="Arial">Full tuition waiver — all universities</text>

  <rect x="48" y="418" width="3" height="16" rx="1.5" fill="#f59e0b" opacity="0.7"/>
  <text x="62" y="430" fill="rgba(255,255,255,0.75)" font-size="14" font-family="Arial">Monthly living stipend (KRW 900,000+)</text>

  <rect x="48" y="444" width="3" height="16" rx="1.5" fill="#f59e0b" opacity="0.5"/>
  <text x="62" y="456" fill="rgba(255,255,255,0.75)" font-size="14" font-family="Arial">Round-trip airfare Nepal ↔ Korea</text>

  <rect x="48" y="470" width="3" height="16" rx="1.5" fill="#f59e0b" opacity="0.35"/>
  <text x="62" y="482" fill="rgba(255,255,255,0.75)" font-size="14" font-family="Arial">1 year Korean language training (paid)</text>

  <!-- Bottom bar -->
  <rect x="0" y="510" width="980" height="30" fill="rgba(0,0,0,0.5)"/>
  <text x="32" y="529" fill="rgba(255,255,255,0.3)" font-size="11" font-family="Arial" letter-spacing="2">POKHARA FUTURE MINDS · New Road, Ward 8, Pokhara · pokharafutureminds.com</text>
</svg>
