<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
  <defs>
    <linearGradient id="left-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1a3a"/>
      <stop offset="100%" stop-color="#1a2a5a"/>
    </linearGradient>
    <linearGradient id="right-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0820"/>
      <stop offset="100%" stop-color="#1a0410"/>
    </linearGradient>
    <linearGradient id="ielts-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="pte-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d13a8a"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>

  <!-- Left half — IELTS -->
  <rect x="0" y="0" width="490" height="540" fill="url(#left-bg)"/>
  <!-- Right half — PTE -->
  <rect x="490" y="0" width="490" height="540" fill="url(#right-bg)"/>

  <!-- Subtle noise/texture lines -->
  <line x1="0" y1="90" x2="490" y2="90" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="490" y1="90" x2="980" y2="90" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Center divider -->
  <rect x="487" y="0" width="6" height="540" fill="#0a0e18"/>
  <line x1="490" y1="0" x2="490" y2="540" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- ─── LEFT: IELTS ─── -->

  <!-- Top accent bar -->
  <rect x="0" y="0" width="490" height="5" fill="url(#ielts-accent)"/>

  <!-- Label -->
  <rect x="40" y="36" width="80" height="26" rx="4" fill="rgba(79,70,229,0.3)" stroke="rgba(79,70,229,0.5)" stroke-width="1"/>
  <text x="80" y="53" text-anchor="middle" fill="#a5b4fc" font-size="11" font-family="Arial" font-weight="700" letter-spacing="1">IELTS</text>

  <!-- Big band score -->
  <text x="40" y="170" fill="#ffffff" font-size="110" font-family="Georgia, ui-serif, serif" font-weight="900" opacity="0.08">9</text>
  <text x="40" y="165" fill="#ffffff" font-size="96" font-family="Georgia, ui-serif, serif" font-weight="900">6.5</text>
  <text x="44" y="196" fill="rgba(165,180,252,0.7)" font-size="14" font-family="Arial" font-weight="600" letter-spacing="2">BAND SCORE</text>

  <!-- Full name -->
  <text x="40" y="240" fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial" font-weight="700">International English</text>
  <text x="40" y="264" fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial" font-weight="700">Language Testing System</text>

  <rect x="40" y="282" width="200" height="1.5" fill="rgba(79,70,229,0.5)"/>

  <!-- Features -->
  <text x="40" y="316" fill="rgba(255,255,255,0.4)" font-size="10" font-family="Arial" font-weight="700" letter-spacing="2">KEY FEATURES</text>

  <text x="52" y="346" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Paper &amp; computer-based options</text>
  <text x="52" y="372" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Human examiner for Speaking test</text>
  <text x="52" y="398" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Accepted in Korea, Japan &amp; worldwide</text>
  <text x="52" y="424" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Results in 3–5 business days</text>
  <text x="52" y="450" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">4 skills: Reading · Writing · Listening · Speaking</text>

  <!-- Dot indicators -->
  <circle cx="42" cy="342" r="3" fill="#4f46e5"/>
  <circle cx="42" cy="368" r="3" fill="#4f46e5"/>
  <circle cx="42" cy="394" r="3" fill="#4f46e5"/>
  <circle cx="42" cy="420" r="3" fill="#4f46e5"/>
  <circle cx="42" cy="446" r="3" fill="#4f46e5"/>

  <!-- Best for tag -->
  <rect x="40" y="474" width="380" height="42" rx="6" fill="rgba(79,70,229,0.15)" stroke="rgba(79,70,229,0.3)" stroke-width="1"/>
  <text x="230" y="492" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10" font-family="Arial" font-weight="700" letter-spacing="1.5">BEST FOR</text>
  <text x="230" y="508" text-anchor="middle" fill="rgba(165,180,252,0.85)" font-size="13" font-family="Arial" font-weight="600">Korea · Japan · UK · Australia · Canada · USA</text>

  <!-- ─── RIGHT: PTE ─── -->

  <!-- Top accent bar -->
  <rect x="490" y="0" width="490" height="5" fill="url(#pte-accent)"/>

  <!-- Label -->
  <rect x="550" y="36" width="80" height="26" rx="4" fill="rgba(209,58,138,0.3)" stroke="rgba(209,58,138,0.5)" stroke-width="1"/>
  <text x="590" y="53" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Arial" font-weight="700" letter-spacing="1">PTE</text>

  <!-- Big score -->
  <text x="550" y="170" fill="#ffffff" font-size="110" font-family="Georgia, ui-serif, serif" font-weight="900" opacity="0.08">9</text>
  <text x="550" y="165" fill="#ffffff" font-size="96" font-family="Georgia, ui-serif, serif" font-weight="900">58</text>
  <text x="554" y="196" fill="rgba(249,168,212,0.7)" font-size="14" font-family="Arial" font-weight="600" letter-spacing="2">OUT OF 90</text>

  <!-- Full name -->
  <text x="550" y="240" fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial" font-weight="700">Pearson Test of English</text>
  <text x="550" y="264" fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial" font-weight="700">Academic</text>

  <rect x="550" y="282" width="200" height="1.5" fill="rgba(209,58,138,0.5)"/>

  <!-- Features -->
  <text x="550" y="316" fill="rgba(255,255,255,0.4)" font-size="10" font-family="Arial" font-weight="700" letter-spacing="2">KEY FEATURES</text>

  <text x="562" y="346" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">100% computer-based test</text>
  <text x="562" y="372" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">AI-scored — no human examiner</text>
  <text x="562" y="398" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Results available in 5 business days</text>
  <text x="562" y="424" fill="rgba(255,255,255,0.7)" font-size="14" font-family="Arial">Integrated skills format (no separate sections)</text>
  <text x="562" y="450" fill="rgba(255,220,100,0.75)" font-size="14" font-family="Arial">⚠ Not accepted in Korea or Japan</text>

  <!-- Dot indicators -->
  <circle cx="552" cy="342" r="3" fill="#d13a8a"/>
  <circle cx="552" cy="368" r="3" fill="#d13a8a"/>
  <circle cx="552" cy="394" r="3" fill="#d13a8a"/>
  <circle cx="552" cy="420" r="3" fill="#d13a8a"/>
  <circle cx="552" cy="446" r="3" fill="rgba(255,220,100,0.6)"/>

  <!-- Best for tag -->
  <rect x="550" y="474" width="390" height="42" rx="6" fill="rgba(209,58,138,0.15)" stroke="rgba(209,58,138,0.3)" stroke-width="1"/>
  <text x="745" y="492" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="10" font-family="Arial" font-weight="700" letter-spacing="1.5">BEST FOR</text>
  <text x="745" y="508" text-anchor="middle" fill="rgba(249,168,212,0.85)" font-size="13" font-family="Arial" font-weight="600">Australia · Canada · UK · USA</text>

  <!-- VS badge center -->
  <circle cx="490" cy="155" r="36" fill="#0a0e18" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="490" cy="155" r="28" fill="#0a0e18"/>
  <text x="490" y="163" text-anchor="middle" fill="#ffffff" font-size="20" font-family="Arial" font-weight="900">VS</text>

  <!-- Bottom watermark -->
  <text x="490" y="528" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="11" font-family="Arial" letter-spacing="2">POKHARA FUTURE MINDS · IELTS &amp; PTE COACHING · pokharafutureminds.com</text>
</svg>
