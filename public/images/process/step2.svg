<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#2d1060"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d13a8a"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0533" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full square background -->
  <rect width="300" height="300" fill="url(#bg2)"/>
  <rect width="300" height="300" fill="url(#glow2)"/>

  <!-- Back doc -->
  <rect x="124" y="68" width="92" height="118" rx="8" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.22)" stroke-width="1.5"/>
  <!-- Middle doc -->
  <rect x="112" y="78" width="92" height="118" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.11)" stroke-width="1.5"/>
  <!-- Front doc -->
  <rect x="88" y="64" width="106" height="138" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <!-- Fold corner -->
  <polygon points="166,64 194,92 166,92" fill="rgba(139,92,246,0.45)"/>
  <polyline points="166,64 166,92 194,92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="98" y="76" width="58" height="13" rx="4" fill="url(#acc2)" opacity="0.85"/>
  <text x="127" y="87" text-anchor="middle" fill="#fff" font-size="7.5" font-family="Arial" font-weight="700">OFFER LETTER</text>

  <!-- Uni badge -->
  <circle cx="176" cy="100" r="13" fill="rgba(209,58,138,0.25)" stroke="#d13a8a" stroke-width="1.5"/>
  <text x="176" y="106" text-anchor="middle" fill="#d13a8a" font-size="13">★</text>

  <!-- Lines -->
  <rect x="98" y="104" width="62" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>
  <rect x="98" y="116" width="82" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="98" y="128" width="74" height="5" rx="2.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="98" y="140" width="80" height="5" rx="2.5" fill="rgba(255,255,255,0.13)"/>
  <rect x="98" y="152" width="54" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>

  <!-- Checklist -->
  <rect x="98" y="168" width="13" height="13" rx="3" fill="url(#acc2)"/>
  <text x="104" y="179" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">✓</text>
  <rect x="118" y="171" width="46" height="5" rx="2.5" fill="rgba(255,255,255,0.25)"/>

  <rect x="98" y="186" width="13" height="13" rx="3" fill="url(#acc2)"/>
  <text x="104" y="197" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">✓</text>
  <rect x="118" y="189" width="36" height="5" rx="2.5" fill="rgba(255,255,255,0.22)"/>

  <!-- Approval stamp -->
  <g transform="translate(178,188) rotate(-15)">
    <circle r="26" fill="rgba(209,58,138,0.1)" stroke="rgba(209,58,138,0.6)" stroke-width="2" stroke-dasharray="4 2"/>
    <circle r="17" fill="rgba(209,58,138,0.15)"/>
    <text y="-5" text-anchor="middle" fill="#d13a8a" font-size="7" font-family="Arial" font-weight="800">APPROVED</text>
    <text y="8"  text-anchor="middle" fill="rgba(209,58,138,0.7)" font-size="14">✦</text>
  </g>
</svg>
