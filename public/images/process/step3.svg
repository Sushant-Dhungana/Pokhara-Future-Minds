<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="acc3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d13a8a"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full square background -->
  <rect width="300" height="300" fill="url(#bg3)"/>
  <rect width="300" height="300" fill="url(#glow3)"/>

  <!-- Desk -->
  <rect x="46" y="202" width="208" height="8" rx="4" fill="rgba(139,92,246,0.4)"/>
  <rect x="46" y="208" width="208" height="50" fill="rgba(12,28,60,0.9)"/>

  <!-- Laptop screen -->
  <rect x="84"  y="132" width="132" height="70" rx="6" fill="rgba(8,18,46,0.95)" stroke="rgba(79,70,229,0.6)" stroke-width="2"/>
  <rect x="88"  y="136" width="124" height="62" rx="4" fill="#08122e"/>
  <!-- Video panel -->
  <rect x="92"  y="140" width="56" height="50" rx="4" fill="rgba(79,70,229,0.25)" stroke="rgba(79,70,229,0.5)" stroke-width="1"/>
  <!-- Avatar -->
  <circle cx="120" cy="157" r="10" fill="rgba(139,92,246,0.55)"/>
  <ellipse cx="120" cy="176" rx="13" ry="8" fill="rgba(139,92,246,0.3)"/>
  <!-- Active dot -->
  <circle cx="140" cy="143" r="4" fill="#22c55e"/>
  <!-- Screen lines -->
  <rect x="154" y="148" width="52" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="154" y="160" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.13)"/>
  <rect x="154" y="172" width="46" height="5" rx="2.5" fill="rgba(255,255,255,0.13)"/>
  <rect x="154" y="184" width="32" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <!-- Laptop base -->
  <rect x="74"  y="200" width="152" height="6" rx="3" fill="rgba(79,70,229,0.45)"/>
  <rect x="106" y="204" width="88" height="4" rx="2" fill="rgba(79,70,229,0.3)"/>

  <!-- Student head -->
  <circle cx="150" cy="100" r="25" fill="#c7d2fe"/>
  <!-- Hair -->
  <ellipse cx="150" cy="82"  rx="25" ry="12" fill="#4f46e5"/>
  <rect x="125" y="82" width="50" height="14" fill="#4f46e5"/>
  <!-- Eyes -->
  <ellipse cx="142" cy="103" rx="3.5" ry="4" fill="rgba(8,18,46,0.65)"/>
  <ellipse cx="158" cy="103" rx="3.5" ry="4" fill="rgba(8,18,46,0.65)"/>
  <!-- Smile -->
  <path d="M143 113 Q150 119 157 113" fill="none" stroke="rgba(8,18,46,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M115 202 Q117 138 150 136 Q183 138 185 202" fill="rgba(79,70,229,0.3)" stroke="rgba(79,70,229,0.5)" stroke-width="1.5"/>
  <path d="M140 136 L150 150 L160 136" fill="rgba(209,58,138,0.5)"/>

  <!-- Speech bubble top-right -->
  <rect x="180" y="64" width="76" height="48" rx="10" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  <polygon points="186,112 178,124 198,112" fill="rgba(139,92,246,0.18)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <rect x="190" y="76"  width="52" height="5" rx="2.5" fill="rgba(255,255,255,0.28)"/>
  <rect x="190" y="88"  width="42" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
  <rect x="190" y="100" width="48" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>

  <!-- Confidence badge top-left -->
  <rect x="34" y="74" width="76" height="36" rx="8" fill="rgba(209,58,138,0.18)" stroke="rgba(209,58,138,0.5)" stroke-width="1.5"/>
  <text x="72" y="91" text-anchor="middle" fill="#d13a8a" font-size="8.5" font-family="Arial" font-weight="700">CONFIDENCE</text>
  <rect x="44" y="101" width="56" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="44" y="101" width="46" height="6" rx="3" fill="url(#acc3)" opacity="0.85"/>
</svg>
