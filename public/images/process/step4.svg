<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061830"/>
      <stop offset="100%" stop-color="#0d2240"/>
    </linearGradient>
    <linearGradient id="acc4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#d13a8a"/>
    </linearGradient>
    <linearGradient id="passport4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3568"/>
      <stop offset="100%" stop-color="#0f2a55"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#061830" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full square background -->
  <rect width="300" height="300" fill="url(#bg4)"/>
  <rect width="300" height="300" fill="url(#glow4)"/>

  <!-- Stars -->
  <circle cx="52"  cy="48"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="96"  cy="34"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="192" cy="40"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="242" cy="58"  r="1"   fill="white" opacity="0.4"/>
  <circle cx="70"  cy="74"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="228" cy="86"  r="1.5" fill="white" opacity="0.5"/>
  <circle cx="258" cy="112" r="1"   fill="white" opacity="0.4"/>

  <!-- Flight arc -->
  <path d="M44 192 Q150 60 256 108" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Airplane -->
  <g transform="translate(224,94) rotate(-32)">
    <ellipse cx="0" cy="0" rx="23" ry="7" fill="#ffffff"/>
    <ellipse cx="19" cy="0" rx="7" ry="5.5" fill="#e0e7ff"/>
    <polygon points="-19,-7 -25,-23 -10,-7" fill="url(#acc4)"/>
    <polygon points="-19,7 -25,20 -10,7" fill="rgba(209,58,138,0.65)"/>
    <polygon points="-4,-7 13,-7 -1,-27 -16,-7" fill="url(#acc4)"/>
    <polygon points="-4,7 13,7 -1,24 -16,7" fill="rgba(139,92,246,0.7)"/>
    <circle cx="4"  cy="0" r="2.5" fill="rgba(165,180,252,0.85)"/>
    <circle cx="12" cy="0" r="2.5" fill="rgba(165,180,252,0.85)"/>
    <ellipse cx="-28" cy="0" rx="10" ry="3" fill="rgba(139,92,246,0.22)"/>
  </g>

  <!-- Passport book -->
  <rect x="68" y="118" width="88" height="120" rx="8" fill="url(#passport4)" stroke="rgba(79,70,229,0.6)" stroke-width="2"/>
  <rect x="68" y="118" width="11" height="120" rx="5.5" fill="rgba(79,70,229,0.5)"/>
  <!-- Emblem -->
  <circle cx="118" cy="162" r="25" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="118" cy="162" r="16" fill="rgba(79,70,229,0.3)"/>
  <text x="118" y="169" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="20" font-family="Arial">★</text>
  <!-- Passport lines -->
  <rect x="84" y="196" width="64" height="5" rx="2.5" fill="rgba(255,255,255,0.18)"/>
  <rect x="84" y="208" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.12)"/>
  <rect x="80" y="222" width="70" height="4" rx="2" fill="rgba(139,92,246,0.4)"/>
  <rect x="80" y="230" width="70" height="4" rx="2" fill="rgba(139,92,246,0.3)"/>

  <!-- VISA stamp -->
  <g transform="translate(142,158) rotate(-15)">
    <rect x="-32" y="-24" width="64" height="48" rx="5" fill="rgba(209,58,138,0.15)" stroke="rgba(209,58,138,0.7)" stroke-width="2"/>
    <text y="-9" text-anchor="middle" fill="#d13a8a" font-size="11" font-family="Arial" font-weight="800">VISA</text>
    <text y="4"  text-anchor="middle" fill="rgba(209,58,138,0.8)" font-size="8" font-family="Arial">APPROVED</text>
    <text y="16" text-anchor="middle" fill="rgba(209,58,138,0.55)" font-size="7.5" font-family="Arial">2026</text>
  </g>

  <!-- Green check badge -->
  <circle cx="212" cy="176" r="30" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.45)" stroke-width="2"/>
  <circle cx="212" cy="176" r="20" fill="rgba(34,197,94,0.22)"/>
  <path d="M200 176 L209 185 L226 164" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkles -->
  <text x="50"  y="134" fill="rgba(255,200,50,0.75)"  font-size="17">✦</text>
  <text x="240" y="148" fill="rgba(139,92,246,0.75)"  font-size="13">✦</text>
</svg>
